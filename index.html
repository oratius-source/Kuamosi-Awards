  <style>

      padding: 2rem 1rem;
      display: flex; justify-content: center;

    .card {

    }
    h1 { color: #0b2b4a; font-size: 1.8rem; margin-bottom: .25rem; }
    .sub { color: #4a5f7a; margin-bottom: 1.5rem; line-height: 1.6; }
    .values { display: flex; flex-wrap: wrap; gap: .4rem; margin: .5rem 0 1.5rem; }
    .chip {
      background: #e8f0fe; border: 1px solid #b9d2fc;
      color: #0f3d7a; font-size: .78rem; font-weight: 600;
      padding: .28rem .7rem; border-radius: 30px;
    }
    label.email-label { display: block; font-weight: 600; color: #1e4b8a; margin-bottom: .5rem; }

      width: 100%; padding: .8rem 1rem; font-size: 1rem;
      border: 1.5px solid #c3d6ee; border-radius: 14px; margin-bottom: 1.2rem;
    }
    input[type=email]:focus { outline: none; border-color: #2e6edf; box-shadow: 0 0 0 3px rgba(46,110,223,.15); }
    .note { background: #eef4ff; padding: .9rem 1.2rem; border-radius: 40px;
            color: #1e4b8a; font-weight: 600; display: inline-block; margin-bottom: 1.2rem; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: .6rem; margin-bottom: 1.6rem;
    }
    .opt {
      display: flex; align-items: center; gap: .6rem;
      background: #f9fcff; border: 1.5px solid #d7e2f0;
      border-radius: 14px; padding: .7rem 1rem; cursor: pointer;
      font-weight: 500; color: #1a2e45;
    }
    .opt:hover { background: #fff; border-color: #90b4e8; }
    .opt input { accent-color: #1e5fd9; width: 18px; height: 18px; }
    button {
      width: 100%; padding: 1rem; font-size: 1.05rem; font-weight: 700;
      color: #fff; background: #1e5fd9; border: none; border-radius: 60px;
      cursor: pointer; transition: .15s;
    }
    button:hover { background: #134bb0; }
    .hint { font-size: .85rem; color: #6b7f99; margin-top: .6rem; }
